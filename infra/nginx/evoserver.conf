# Reverse proxy for evoserver services.
# 2026-10-09: tried to make every subdomain work after the Cloudflare tunnel change.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/evoserver.lan.crt;
    ssl_certificate_key /etc/nginx/certs/evoserver.lan.key;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

server {
    listen 80;
    server_name jellyfin.evoserver.lan;
    allow 192.168.1.0/24;
    allow 100.64.0.0/10;
    deny all;
    location / {
        proxy_pass http://jellyfin:8096;
    }
}
